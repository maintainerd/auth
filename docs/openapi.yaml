openapi: 3.1.0
info:
  title: maintainerd-auth
  description: >
    Multi-tenant Identity Provider and OAuth 2.0 authorization server.
    Exposes two ports: the internal management API (8080) for tenant/user/role/client
    administration and the public identity API (8081) for login, registration,
    OAuth 2.0 flows, and OpenID Connect discovery.
  version: 1.0.0
  contact:
    name: Reyco Seguma
    url: https://github.com/maintainerd/maintainerd-auth

servers:
  - url: http://localhost:8080/api/v1
    description: Internal management API
  - url: http://localhost:8081/api/v1
    description: Public identity API

security:
  - bearerAuth: []

# ──────────────────────────────────────────────────────────────────────────────
# Tags
# ──────────────────────────────────────────────────────────────────────────────
tags:
  - name: Tenants
    description: Tenant management
  - name: Users
    description: User management
  - name: Roles
    description: Role management
  - name: Clients
    description: OAuth client management
  - name: Identity Providers
    description: Identity provider management
  - name: Auth
    description: Authentication — login, registration, password reset, magic link, SMS OTP
  - name: OAuth 2.0
    description: OAuth 2.0 / OpenID Connect authorization server endpoints
  - name: Webhook Endpoints
    description: Webhook endpoint management
  - name: Auth Events
    description: Audit log of authentication and authorization events (read-only)
  - name: API Keys
    description: API key management
  - name: IAM
    description: IAM services, policies, and service-to-service authorization
  - name: Profile
    description: Authenticated user profile (self-service)
  - name: MFA
    description: Multi-factor authentication — TOTP, WebAuthn, backup codes

# ──────────────────────────────────────────────────────────────────────────────
# Paths
# ──────────────────────────────────────────────────────────────────────────────
paths:

  # ============================================================
  # Tenants
  # ============================================================
  /tenants:
    get:
      tags: [Tenants]
      summary: List tenants
      operationId: listTenants
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort_by'
        - $ref: '#/components/parameters/sort_order'
        - name: name
          in: query
          schema:
            type: string
          description: Filter by tenant name (partial match)
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, pending, suspended]
          description: Filter by status
      responses:
        '200':
          $ref: '#/components/responses/PaginatedSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Tenants]
      summary: Create tenant
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenant_uuid}:
    parameters:
      - $ref: '#/components/parameters/tenant_uuid'

    get:
      tags: [Tenants]
      summary: Get tenant by UUID
      operationId: getTenant
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Tenants]
      summary: Update tenant
      operationId: updateTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Tenants]
      summary: Delete tenant
      operationId: deleteTenant
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenant_uuid}/status:
    parameters:
      - $ref: '#/components/parameters/tenant_uuid'
    patch:
      tags: [Tenants]
      summary: Set tenant status
      operationId: setTenantStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
