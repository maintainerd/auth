        - name: phone
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, pending, suspended]
        - name: tenant_id
          in: query
          schema:
            type: string
            format: uuid
        - name: role_id
          in: query
          schema:
            type: string
            format: uuid
