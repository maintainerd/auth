# =============================================================================
# maintainerd-auth — run the whole auth stack from this single repo, one command.
#
#   docker compose up --build
#
# Brings up the all-in-one image (Go backend + admin console + hosted identity)
# plus Postgres, Redis and RabbitMQ. After it's healthy:
#   http://localhost:3000   admin console
#   http://localhost:3001   hosted identity
#   http://localhost:8080   control-plane API      http://localhost:8081  data-plane API
#
# Requires a .env with the backend config + secrets (DB/Redis/RabbitMQ creds,
# JWT/encryption keys). The service names below match the dev .env sample
# (DB_HOST=postgres-db, REDIS_ADDR=redis-db:6379, RABBITMQ_URL=...@rabbitmq).
# The maintainerd-dev repo's `./maintainerd setup` generates a ready .env
# (keys + certs); copy it here, or provide your own.
# =============================================================================

services:
  maintainerd-auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: dev
    image: maintainerd-auth:local
    env_file: .env
    ports:
      - "8080:8080"   # control-plane API
      - "8081:8081"   # data-plane API (OAuth2/OIDC)
      - "3000:3000"   # admin console SPA
      - "3001:3001"   # hosted identity SPA
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  postgres-db:  # nosemgrep
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-devuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Pass123}
      POSTGRES_DB: ${DB_NAME:-maintainerd}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-devuser} -d ${DB_NAME:-maintainerd}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis-db:  # nosemgrep
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-Pass123}", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Pass123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:  # nosemgrep
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${DB_USER:-devuser}
      RABBITMQ_DEFAULT_PASS: ${DB_PASSWORD:-Pass123}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
