# Pull in the SigNoz observability stack (ClickHouse, collector, UI) so a single
# `docker compose up --build -d` brings up everything. SigNoz's OTLP collector
# listens on host ports 4317/4318; its UI is at http://localhost:8080.
# Vendored from github.com/SigNoz/signoz (deploy/) at v0.128.0.
include:
  - deploy/signoz/docker/docker-compose.yaml

services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: m9d-auth-dev
    container_name: m9d-auth-dev
    volumes:
      # Mount source code for hot reloading
      - .:/usr/src/app
      # Mount go mod cache for faster builds
      - go-mod-cache:/go/pkg/mod
      # Mount build cache
      - go-build-cache:/root/.cache/go-build
    environment:
      - ENV=local
      - CGO_ENABLED=0
      # OpenTelemetry — vendor-neutral OTLP. Forced on for this local stack so
      # telemetry flows to the bundled SigNoz with no extra setup. The app only
      # ever speaks OTLP, so prod can point these elsewhere (Datadog/Grafana/...)
      # with zero code changes. The local default resolves to the SigNoz
      # collector over the Compose network instead of a host-published port.
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-maintainerd-auth}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      - OTEL_EXPORTER_OTLP_INSECURE=${OTEL_EXPORTER_OTLP_INSECURE:-true}
      # RabbitMQ broker (optional — remove or leave empty to disable broker delivery)
      - RABBITMQ_URL=amqp://devuser:Pass123@rabbitmq:5672/
    # Lets the container reach a collector published on the host if you override
    # OTEL_EXPORTER_OTLP_ENDPOINT to host.docker.internal for a different backend.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres-db
      - redis-db
      - rabbitmq
      - otel-collector
    networks:
      - default
      - signoz-net
    # Add restart policy for development
    restart: unless-stopped

  # auth-web:
  #   build:
  #     context: ../auth-web
  #     dockerfile: Dockerfile.local
  #   image: m9d-auth-web-dev
  #   container_name: m9d-auth-web-dev
  #   volumes:
  #     - ../auth-web:/app
  #     - node_modules_cache:/app/node_modules
  #   environment:
  #     - NODE_ENV=development
  #     - CHOKIDAR_USEPOLLING=true
  #     - CHOKIDAR_INTERVAL=100
  #   depends_on:
  #     - auth
  #   restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - auth
    networks:
      - default
    restart: unless-stopped

  postgres-db:
    image: postgres:17
    container_name: postgres-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: Pass123
      POSTGRES_DB: maintainerd
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis-db:
    image: redis:7
    container_name: redis-db
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "Pass123"]
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672" # AMQP protocol port
      - "15672:15672" # RabbitMQ management UI
    environment:
      RABBITMQ_DEFAULT_USER: devuser
      RABBITMQ_DEFAULT_PASS: Pass123
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    depends_on:
      - auth
    networks:
      - default
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - default
    restart: unless-stopped

networks:
  default:
    driver: bridge

volumes:
  go-mod-cache:
  go-build-cache:
  node_modules_cache:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
