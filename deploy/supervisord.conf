; Process supervisor for the all-in-one image: runs the Go backend and nginx
; side by side. tini is PID 1 (see Dockerfile ENTRYPOINT) and reaps zombies;
; supervisord just keeps the two long-lived services up. Runs fully non-root.
[supervisord]
nodaemon=true
user=m9d
pidfile=/tmp/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0

; If either critical service exits, take the whole container down so the
; orchestrator restarts a clean instance rather than serving half a stack.
[eventlistener:exit-on-fatal]
command=sh -c "printf 'READY\n'; while read line; do kill -SIGTERM 1; done"
events=PROCESS_STATE_FATAL

[program:auth]
command=/usr/local/bin/auth
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
