# nginx config for the all-in-one maintainerd-auth image.
#
# Serves BOTH frontends from one nginx and proxies their same-origin API calls
# to the Go backend running in the SAME container:
#   :3000  admin console  (/api -> control plane :8080, /public-api -> data plane :8081)
#   :3001  hosted identity (/api -> data plane :8081)
#
# Auth cookies are __Host- prefixed (host-only), so the API MUST be same-origin
# with each SPA — hence the per-SPA proxy rather than pointing the browser at the
# backend directly. Upstream origins are substituted at container start by
# deploy/entrypoint.sh (__INTERNAL_API_ORIGIN__ / __PUBLIC_API_ORIGIN__).

worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    server_tokens off;

    # Preserve the edge proxy's forwarded scheme. This image serves plain HTTP
    # (TLS is terminated upstream), so blindly forwarding $scheme would tell the
    # backend "http" behind an https edge — breaking Secure/__Host- cookies and
    # the OIDC issuer scheme. Use the edge's value when present; else $scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default     $scheme;
        "~^https?$" $http_x_forwarded_proto;
    }

    # Temp paths under /tmp so nginx runs fully non-root.
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Shared proxy settings for both planes.
    proxy_http_version 1.1;
    proxy_buffer_size  16k;
    proxy_buffers      8 16k;
    proxy_busy_buffers_size 16k;

    # ── Admin console (control + data plane) ──────────────────────────────────
    server {
        listen 3000;
        server_name _;
        root /srv/console;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Control plane (management API). $host is forwarded so the backend can
        # resolve the tenant/surface from the request host.
        location /api/ {
            proxy_pass __INTERNAL_API_ORIGIN__;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Data plane (OAuth2/OIDC + tenant bootstrap); prefix stripped so the
        # backend sees its normal /api/v1/... path.
        location /public-api/ {
            rewrite ^/public-api/(.*)$ /$1 break;
            proxy_pass __PUBLIC_API_ORIGIN__;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /config.js { add_header Cache-Control "no-store" always; }
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ /index.html; }
    }

    # ── Hosted identity (data plane only) ─────────────────────────────────────
    server {
        listen 3001;
        server_name _;
        root /srv/identity;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # OIDC discovery + JWKS live at the issuer root, NOT under /api. When the
        # identity origin is the issuer, these must reach the data plane or
        # relying parties get the SPA's index.html (200) instead of JSON and no
        # standards-compliant client can discover or validate this AS.
        location /.well-known/ {
            proxy_pass __PUBLIC_API_ORIGIN__;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /api/ {
            proxy_pass __PUBLIC_API_ORIGIN__;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /config.js { add_header Cache-Control "no-store" always; }
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
