name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Runs every day at 02:00 UTC — catches newly published CVEs even without a push
    - cron: "0 2 * * *"

# Minimal default token scope; each job escalates security-events: write itself.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # CodeQL — GitHub-native semantic SAST for Go
  # No extra secrets needed; results appear in Security → Code Scanning tab.
  # ─────────────────────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: go
          # security-extended adds CWE coverage beyond the default query suite
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "/language:go"

  # ─────────────────────────────────────────────────────────────────────────────
  # Semgrep — open-source SAST (Go + OWASP Top-Ten + secrets rulesets)
  # Runs fully offline with no token required via `semgrep scan`.
  # Requires: SEMGREP_APP_TOKEN secret to pull rules from Semgrep Cloud org
  # and push results back. Results also upload to GitHub Code Scanning via SARIF.
  # ─────────────────────────────────────────────────────────────────────────────
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep CI
        # Connected scan: `semgrep ci` runs the rules configured on the Semgrep
        # Cloud org (rule board) and reports findings to the dashboard. `--config`
        # cannot be combined with a logged-in run, so rulesets are managed in the
        # cloud policy; `--sarif-output` also writes SARIF for GitHub Code Scanning.
        run: semgrep ci --sarif-output=semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Ensure SARIF file exists
        if: always()
        run: |
          if [ ! -f semgrep.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Semgrep","rules":[]}},"results":[]}]}' > semgrep.sarif
          fi

      - name: Upload Semgrep results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ─────────────────────────────────────────────────────────────────────────────
  # Gitleaks — detect secrets / credentials committed anywhere in the git history
  # Uses the Gitleaks CLI directly (no GitHub Action) to avoid the org-license
  # requirement introduced in gitleaks-action v2. No secrets needed.
  # ─────────────────────────────────────────────────────────────────────────────
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full depth so Gitleaks can audit every commit, not just the latest snapshot
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          VERSION="v8.24.3"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --no-banner \
            --config .gitleaks.toml \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Ensure SARIF file exists
        # Gitleaks does not write the report file when zero leaks are found.
        # upload-sarif requires the file to exist, so create a valid empty one as a fallback.
        if: always()
        run: |
          [ -f gitleaks.sarif ] || cat <<'EOF' > gitleaks.sarif
          {"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Gitleaks","rules":[]}},"results":[]}]}
          EOF

      - name: Upload Gitleaks results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ─────────────────────────────────────────────────────────────────────────────
  # govulncheck — the Go team's vulnerability scanner. This is the dependency
  # (SCA) gate for Go, complementing CodeQL/Semgrep (which find bugs in our own
  # code). It is reachability-aware: it reports only CVEs whose vulnerable SYMBOL
  # is actually called from this module, and it covers the Go standard library —
  # which Dependabot does not, because the stdlib is not in go.mod. Needs no
  # token or account, so it cannot silently stop running. Dependabot handles the
  # upgrade PRs; this gate fails the build on any reachable CVE.
  # ─────────────────────────────────────────────────────────────────────────────
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Read the toolchain from go.mod so a stdlib CVE fix is picked up by
          # bumping the `go` directive — the same lever that fixes it locally.
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        # Fails the build on any CALLED vulnerability. Findings that exist in the
        # graph but are unreachable do not block, which keeps the gate actionable
        # rather than something people learn to ignore.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@19b0bb6a272792b9afa8a6983c3e9b9a1816947f # v1.6.0
          govulncheck ./...
