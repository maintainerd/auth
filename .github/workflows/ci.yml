name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Proto — buf lint + breaking checks
  # ─────────────────────────────────────────────────────────────────────────────
  proto:
    name: Proto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.59.0

      - name: Lint proto contracts
        run: make proto-lint

      - name: Check proto breaking changes
        run: make proto-breaking

  # ─────────────────────────────────────────────────────────────────────────────
  # Test — unit tests with race detector + coverage
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go: ["1.26.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests (race detector + coverage)
        id: unit-tests
        continue-on-error: true
        run: |
          go test ./... \
            -count=1 \
            -race \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -timeout=600s

      - name: Print coverage summary
        if: ${{ always() && hashFiles('coverage.out') != '' }}
        run: go tool cover -func=coverage.out | tail -1

      - name: Enforce coverage floor
        if: ${{ always() && hashFiles('coverage.out') != '' }}
        env:
          # Absolute floor that prevents regression. Ratchet toward 80% as
          # coverage improves (baseline ~69%); Codecov also enforces the
          # relative no-regression check.
          COVERAGE_MIN: "68"
        run: |
          # Exclude generated protobuf code — same exclusion policy as gosec.
          # internal/platform/gen contains ~12k statements of codegen that are
          # never directly unit-tested; including them collapses the metric.
          grep -v 'internal/platform/gen/' coverage.out > coverage_filtered.out
          total=$(go tool cover -func=coverage_filtered.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "Total coverage (excl. generated): ${total}% (floor: ${COVERAGE_MIN}%)"
          awk "BEGIN{ exit !(${total} >= ${COVERAGE_MIN}) }" || {
            echo "::error::coverage ${total}% is below the ${COVERAGE_MIN}% floor";
            exit 1;
          }

      - name: Upload coverage to Codecov
        if: ${{ always() && hashFiles('coverage.out') != '' }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage.out
          flags: unittests
          name: maintainerd-auth
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Fail if tests failed
        if: ${{ steps.unit-tests.outcome == 'failure' }}
        run: exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Lint — static analysis with golangci-lint
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.8
          # G101: false-positive "hardcoded credentials" on constant names.
          # G115: int->int32 overflow on bounded pagination/port/retry values
          #       (page/limit/totalPages, port, max_retries) mapped to proto
          #       int32 fields — noisy and not a real overflow risk here.
          gosec -exclude=G101,G115 -exclude-dir=internal/platform/gen ./...

  # ─────────────────────────────────────────────────────────────────────────────
  # Build — ensure the binary compiles cleanly
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Build binary
        run: go build -v -o /dev/null ./cmd/server

  # ─────────────────────────────────────────────────────────────────────────────
  # Vuln — known-vulnerability scan of Go dependencies + stdlib
  # ─────────────────────────────────────────────────────────────────────────────
  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@19b0bb6a272792b9afa8a6983c3e9b9a1816947f # v1.6.0
          govulncheck ./...
