name: Licenses

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-licenses:
    name: Go dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest
      - name: Check for forbidden/restricted/reciprocal licenses
        # Apache-2.0 project: fail the build on GPL/AGPL/LGPL and other copyleft.
        run: go-licenses check ./... --disallowed_types=forbidden,restricted,reciprocal
      - name: Generate third-party notices
        run: |
          printf '# Third-Party Notices\n\nGenerated by go-licenses. See NOTICE for project copyright.\n\n' > THIRD_PARTY_NOTICES.md
          go-licenses report ./... 2>/dev/null | sort >> THIRD_PARTY_NOTICES.md || true
      - name: Upload third-party notices
        uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES.md
