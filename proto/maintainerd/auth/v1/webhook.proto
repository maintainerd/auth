syntax = "proto3";

package maintainerd.auth.v1;

import "google/protobuf/timestamp.proto";
import "maintainerd/auth/v1/tenant.proto";

option go_package = "github.com/maintainerd/maintainerd-auth/internal/platform/gen/go/maintainerd/auth;authv1";

// WebhookEndpointService used to be declared here with no handler registered
// anywhere in the tree, so every RPC it advertised answered UNIMPLEMENTED. A
// published contract that names RPCs the server never serves cannot be told
// apart from one that is simply down, so the service block was removed: webhook
// endpoint administration is REST control-plane only (see
// internal/webhook/routes.go). The messages below are kept as the agreed wire
// shape for the day a handler is written.

message WebhookEndpoint {
  string webhook_endpoint_uuid = 1;
  string url = 2;
  string description = 3;
  repeated string events = 4;
  int32 max_retries = 5;
  int32 timeout_seconds = 6;
  string status = 7;
  google.protobuf.Timestamp last_triggered_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message ListWebhookEndpointsRequest {
  string tenant_uuid = 1;
  repeated string status = 2;
  Pagination pagination = 3;
}
message ListWebhookEndpointsResponse { repeated WebhookEndpoint endpoints = 1; PageMetadata page = 2; }
message GetWebhookEndpointRequest { string tenant_uuid = 1; string webhook_endpoint_uuid = 2; }
message GetWebhookEndpointResponse { WebhookEndpoint endpoint = 1; }
message CreateWebhookEndpointRequest {
  string tenant_uuid = 1;
  string url = 2;
  string secret = 3;
  repeated string events = 4;
  optional int32 max_retries = 5;
  optional int32 timeout_seconds = 6;
  string description = 7;
  string status = 8;
}
message CreateWebhookEndpointResponse { WebhookEndpoint endpoint = 1; }
message UpdateWebhookEndpointRequest {
  string tenant_uuid = 1;
  string webhook_endpoint_uuid = 2;
  string url = 3;
  string secret = 4;
  repeated string events = 5;
  optional int32 max_retries = 6;
  optional int32 timeout_seconds = 7;
  string description = 8;
  string status = 9;
}
message UpdateWebhookEndpointResponse { WebhookEndpoint endpoint = 1; }
message SetWebhookEndpointStatusRequest { string tenant_uuid = 1; string webhook_endpoint_uuid = 2; string status = 3; }
message SetWebhookEndpointStatusResponse { WebhookEndpoint endpoint = 1; }
message DeleteWebhookEndpointRequest { string tenant_uuid = 1; string webhook_endpoint_uuid = 2; }
message DeleteWebhookEndpointResponse { WebhookEndpoint endpoint = 1; }
