syntax = "proto3";

package maintainerd.auth.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "maintainerd/auth/v1/tenant.proto";

option go_package = "github.com/maintainerd/maintainerd-auth/internal/platform/gen/go/maintainerd/auth;authv1";

// IdentityProviderService and RegistrationFlowService used to be declared here
// with no handler registered anywhere in the tree, so every RPC they advertised
// answered UNIMPLEMENTED. A published contract that names RPCs the server never
// serves cannot be told apart from one that is simply down, so both service
// blocks were removed: identity-provider and registration-flow administration is
// REST control-plane only (see internal/idp/routes.go). The messages below are
// kept as the agreed wire shape for the day a handler is written.

message IdentityProvider {
  string identity_provider_uuid = 1;
  string name = 2;
  string display_name = 3;
  string provider = 4;
  string provider_type = 5;
  string identifier = 6;
  google.protobuf.Struct config = 7;
  string status = 8;
  bool is_default = 9;
  bool is_system = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  // Promoted columns. The upstream client secret is intentionally absent here and
  // is never emitted in any response.
  string issuer = 13;
  string provider_client_id = 14;
  bool allow_jit_provisioning = 15;
  repeated string email_domains = 16;
  bool allow_token_federation = 17;
  repeated string allowed_audiences = 18;
}

message RegistrationFlow {
  string registration_flow_uuid = 1;
  string name = 2;
  string description = 3;
  string identifier = 4;
  google.protobuf.Struct config = 5;
  string status = 6;
  string client_uuid = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message RegistrationFlowRole {
  string registration_flow_role_uuid = 1;
  string role_uuid = 2;
  string role_name = 3;
  string role_description = 4;
  bool role_is_default = 5;
  bool role_is_system = 6;
  string role_status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListIdentityProvidersRequest {
  string tenant_uuid = 1;
  string name = 2;
  string display_name = 3;
  repeated string provider = 4;
  string provider_type = 5;
  string identifier = 6;
  repeated string status = 7;
  optional bool is_default = 8;
  optional bool is_system = 9;
  Pagination pagination = 10;
}

message ListIdentityProvidersResponse {
  repeated IdentityProvider identity_providers = 1;
  PageMetadata page = 2;
}

message GetIdentityProviderRequest {
  string tenant_uuid = 1;
  string identity_provider_uuid = 2;
}

message GetIdentityProviderResponse {
  IdentityProvider identity_provider = 1;
}

message CreateIdentityProviderRequest {
  string tenant_uuid = 1;
  string name = 2;
  string display_name = 3;
  string provider = 4;
  string provider_type = 5;
  google.protobuf.Struct config = 6;
  string status = 7;
  string actor_user_uuid = 8;
  string issuer = 9;
  string provider_client_id = 10;
  bool allow_jit_provisioning = 11;
  repeated string email_domains = 12;
  bool allow_token_federation = 13;
  repeated string allowed_audiences = 14;
}

message CreateIdentityProviderResponse {
  IdentityProvider identity_provider = 1;
}

message UpdateIdentityProviderRequest {
  string tenant_uuid = 1;
  string identity_provider_uuid = 2;
  string name = 3;
  string display_name = 4;
  string provider = 5;
  string provider_type = 6;
  google.protobuf.Struct config = 7;
  string status = 8;
  string actor_user_uuid = 9;
  string issuer = 10;
  string provider_client_id = 11;
  bool allow_jit_provisioning = 12;
  repeated string email_domains = 13;
  bool allow_token_federation = 14;
  repeated string allowed_audiences = 15;
}

message UpdateIdentityProviderResponse {
  IdentityProvider identity_provider = 1;
}

message SetIdentityProviderStatusRequest {
  string tenant_uuid = 1;
  string identity_provider_uuid = 2;
  string status = 3;
  string actor_user_uuid = 4;
}

message SetIdentityProviderStatusResponse {
  IdentityProvider identity_provider = 1;
}

message DeleteIdentityProviderRequest {
  string tenant_uuid = 1;
  string identity_provider_uuid = 2;
  string actor_user_uuid = 3;
}

message DeleteIdentityProviderResponse {
  IdentityProvider identity_provider = 1;
}

message ListRegistrationFlowsRequest {
  string tenant_uuid = 1;
  string name = 2;
  string identifier = 3;
  repeated string status = 4;
  string client_uuid = 5;
  Pagination pagination = 6;
}

message ListRegistrationFlowsResponse {
  repeated RegistrationFlow registration_flows = 1;
  PageMetadata page = 2;
}

message GetRegistrationFlowRequest {
  string tenant_uuid = 1;
  string registration_flow_uuid = 2;
}

message GetRegistrationFlowResponse {
  RegistrationFlow registration_flow = 1;
}

message CreateRegistrationFlowRequest {
  string tenant_uuid = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Struct config = 4;
  string status = 5;
  string client_uuid = 6;
}

message CreateRegistrationFlowResponse {
  RegistrationFlow registration_flow = 1;
}

message UpdateRegistrationFlowRequest {
  string tenant_uuid = 1;
  string registration_flow_uuid = 2;
  string name = 3;
  string description = 4;
  google.protobuf.Struct config = 5;
  string status = 6;
}

message UpdateRegistrationFlowResponse {
  RegistrationFlow registration_flow = 1;
}

message SetRegistrationFlowStatusRequest {
  string tenant_uuid = 1;
  string registration_flow_uuid = 2;
  string status = 3;
}

message SetRegistrationFlowStatusResponse {
  RegistrationFlow registration_flow = 1;
}

message DeleteRegistrationFlowRequest {
  string tenant_uuid = 1;
  string registration_flow_uuid = 2;
}

message DeleteRegistrationFlowResponse {
  RegistrationFlow registration_flow = 1;
}

message AssignRegistrationFlowRolesRequest {
  string tenant_uuid = 1;
  string registration_flow_uuid = 2;
  repeated string role_uuids = 3;
}

message AssignRegistrationFlowRolesResponse {
  repeated RegistrationFlowRole roles = 1;
}

message ListRegistrationFlowRolesRequest {
  string tenant_uuid = 1;
  string registration_flow_uuid = 2;
  Pagination pagination = 3;
}

message ListRegistrationFlowRolesResponse {
  repeated RegistrationFlowRole roles = 1;
  PageMetadata page = 2;
}

message RemoveRegistrationFlowRoleRequest {
  string tenant_uuid = 1;
  string registration_flow_uuid = 2;
  string role_uuid = 3;
}

message RemoveRegistrationFlowRoleResponse {
  bool removed = 1;
}
