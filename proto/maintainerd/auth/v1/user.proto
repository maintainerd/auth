syntax = "proto3";

package maintainerd.auth.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "maintainerd/auth/v1/tenant.proto";

option go_package = "github.com/maintainerd/maintainerd-auth/internal/platform/gen/go/maintainerd/auth;authv1";

service UserService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc SetUserStatus(SetUserStatusRequest) returns (SetUserStatusResponse);
  rpc VerifyUserEmail(VerifyUserEmailRequest) returns (VerifyUserEmailResponse);
  rpc VerifyUserPhone(VerifyUserPhoneRequest) returns (VerifyUserPhoneResponse);
  rpc CompleteUserAccount(CompleteUserAccountRequest) returns (CompleteUserAccountResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc ForceUserPasswordChange(ForceUserPasswordChangeRequest) returns (ForceUserPasswordChangeResponse);
  rpc ListUserRoles(ListUserRolesRequest) returns (ListUserRolesResponse);
  rpc ListUserIdentities(ListUserIdentitiesRequest) returns (ListUserIdentitiesResponse);
  rpc AssignUserRoles(AssignUserRolesRequest) returns (AssignUserRolesResponse);
  rpc RemoveUserRole(RemoveUserRoleRequest) returns (RemoveUserRoleResponse);
}

// InviteService used to be declared here with no handler registered anywhere in
// the tree, so SendInvite answered UNIMPLEMENTED. A published contract that names
// RPCs the server never serves cannot be told apart from one that is simply down,
// so the service block was removed: invites are REST control-plane only (see
// internal/invite/routes.go). SendInviteRequest below also drifted from the
// domain — invite.InviteService.SendInvite takes a registration_flow_uuid and a
// callback_url and has no role_uuids parameter — so re-declaring the RPC would
// have to correct the message first.

service UserProfileService {
  rpc ListUserProfiles(ListUserProfilesRequest) returns (ListUserProfilesResponse);
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);
  rpc CreateUserProfile(CreateUserProfileRequest) returns (CreateUserProfileResponse);
  rpc UpdateUserProfile(UpdateUserProfileRequest) returns (UpdateUserProfileResponse);
  rpc SetDefaultUserProfile(SetDefaultUserProfileRequest) returns (SetDefaultUserProfileResponse);
  rpc DeleteUserProfile(DeleteUserProfileRequest) returns (DeleteUserProfileResponse);
}

message User {
  string user_uuid = 1;
  string username = 2;
  string fullname = 3;
  string email = 4;
  string phone = 5;
  bool is_email_verified = 6;
  bool is_phone_verified = 7;
  bool is_profile_completed = 8;
  bool is_account_completed = 9;
  string status = 10;
  google.protobuf.Struct metadata = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message UserIdentity {
  string user_identity_uuid = 1;
  string provider = 2;
  string sub = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message UserRole {
  string role_uuid = 1;
  string name = 2;
  string description = 3;
  bool is_default = 4;
  bool is_system = 5;
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message UserProfile {
  string profile_uuid = 1;
  string first_name = 2;
  string middle_name = 3;
  string last_name = 4;
  string suffix = 5;
  string display_name = 6;
  string bio = 7;
  string birthdate = 8;
  string gender = 9;
  string phone = 10;
  string email = 11;
  string address = 12;
  string city = 13;
  string country = 14;
  string timezone = 15;
  string language = 16;
  string profile_url = 17;
  bool is_default = 18;
  google.protobuf.Struct metadata = 19;
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
}

message ListUsersRequest {
  string tenant_uuid = 1;
  string username = 2;
  string email = 3;
  string phone = 4;
  repeated string status = 5;
  Pagination pagination = 6;
}

message ListUsersResponse {
  repeated User users = 1;
  PageMetadata page = 2;
}

message GetUserRequest {
  string tenant_uuid = 1;
  string user_uuid = 2;
}

message GetUserResponse {
  User user = 1;
}

message CreateUserRequest {
  reserved 3;
  reserved "fullname"; // removed: display name lives in Profile
  string tenant_uuid = 1;
  string username = 2;
  string email = 4;
  string phone = 5;
  string password = 6;
  string status = 7;
  google.protobuf.Struct metadata = 8;
  string actor_user_uuid = 9;
}

message CreateUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  reserved 4;
  reserved "fullname"; // removed: display name lives in Profile
  string tenant_uuid = 1;
  string user_uuid = 2;
  string username = 3;
  string email = 5;
  string phone = 6;
  string status = 7;
  google.protobuf.Struct metadata = 8;
  string actor_user_uuid = 9;
}

message UpdateUserResponse {
  User user = 1;
}

message SetUserStatusRequest {
  string tenant_uuid = 1;
  string user_uuid = 2;
  string status = 3;
  string actor_user_uuid = 4;
}

message SetUserStatusResponse {
  User user = 1;
}

message VerifyUserEmailRequest {
  string tenant_uuid = 1;
  string user_uuid = 2;
}

message VerifyUserEmailResponse {
  User user = 1;
}

message VerifyUserPhoneRequest {
  string tenant_uuid = 1;
  string user_uuid = 2;
}

message VerifyUserPhoneResponse {
  User user = 1;
}

message CompleteUserAccountRequest {
  string tenant_uuid = 1;
  string user_uuid = 2;
}

message CompleteUserAccountResponse {
  User user = 1;
}

message DeleteUserRequest {
  string tenant_uuid = 1;
  string user_uuid = 2;
  string actor_user_uuid = 3;
}

message DeleteUserResponse {
  User user = 1;
}

message ForceUserPasswordChangeRequest {
  string tenant_uuid = 1;
  string user_uuid = 2;
  bool force = 3;
}

message ForceUserPasswordChangeResponse {
  bool success = 1;
}

message ListUserRolesRequest {
  string tenant_uuid = 1;
  string user_uuid = 2;
  Pagination pagination = 3;
}

message ListUserRolesResponse {
  repeated UserRole roles = 1;
  PageMetadata page = 2;
}

message ListUserIdentitiesRequest {
  string tenant_uuid = 1;
  string user_uuid = 2;
  Pagination pagination = 3;
}

message ListUserIdentitiesResponse {
  repeated UserIdentity identities = 1;
  PageMetadata page = 2;
}

message AssignUserRolesRequest {
  string tenant_uuid = 1;
  string user_uuid = 2;
  repeated string role_uuids = 3;
}

message AssignUserRolesResponse {
  User user = 1;
}

message RemoveUserRoleRequest {
  string tenant_uuid = 1;
  string user_uuid = 2;
  string role_uuid = 3;
}

message RemoveUserRoleResponse {
  User user = 1;
}

message SendInviteRequest {
  string tenant_uuid = 1;
  string email = 2;
  repeated string role_uuids = 3;
  string actor_user_uuid = 4;
}

message SendInviteResponse {
  string message = 1;
}

message ListUserProfilesRequest {
  string tenant_uuid = 1;
  string user_uuid = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  string phone = 6;
  string city = 7;
  string country = 8;
  optional bool is_default = 9;
  Pagination pagination = 10;
}

message ListUserProfilesResponse {
  repeated UserProfile profiles = 1;
  PageMetadata page = 2;
}

message GetUserProfileRequest {
  string tenant_uuid = 1;
  string user_uuid = 2;
  string profile_uuid = 3;
}

message GetUserProfileResponse {
  UserProfile profile = 1;
}

message CreateUserProfileRequest {
  string tenant_uuid = 1;
  string user_uuid = 2;
  string first_name = 3;
  string middle_name = 4;
  string last_name = 5;
  string suffix = 6;
  string display_name = 7;
  string bio = 8;
  string birthdate = 9;
  string gender = 10;
  string phone = 11;
  string email = 12;
  string address = 13;
  string city = 14;
  string country = 15;
  string timezone = 16;
  string language = 17;
  string profile_url = 18;
  google.protobuf.Struct metadata = 19;
}

message CreateUserProfileResponse {
  UserProfile profile = 1;
}

message UpdateUserProfileRequest {
  string tenant_uuid = 1;
  string user_uuid = 2;
  string profile_uuid = 3;
  string first_name = 4;
  string middle_name = 5;
  string last_name = 6;
  string suffix = 7;
  string display_name = 8;
  string bio = 9;
  string birthdate = 10;
  string gender = 11;
  string phone = 12;
  string email = 13;
  string address = 14;
  string city = 15;
  string country = 16;
  string timezone = 17;
  string language = 18;
  string profile_url = 19;
  google.protobuf.Struct metadata = 20;
}

message UpdateUserProfileResponse {
  UserProfile profile = 1;
}

message SetDefaultUserProfileRequest {
  string tenant_uuid = 1;
  string user_uuid = 2;
  string profile_uuid = 3;
}

message SetDefaultUserProfileResponse {
  UserProfile profile = 1;
}

message DeleteUserProfileRequest {
  string tenant_uuid = 1;
  string user_uuid = 2;
  string profile_uuid = 3;
}

message DeleteUserProfileResponse {
  UserProfile profile = 1;
}
