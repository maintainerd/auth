syntax = "proto3";

package maintainerd.auth.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "maintainerd/auth/v1/tenant.proto";

option go_package = "github.com/maintainerd/maintainerd-auth/internal/platform/gen/go/maintainerd/auth;authv1";

service ClientService {
  rpc ListClients(ListClientsRequest) returns (ListClientsResponse);
  rpc GetClient(GetClientRequest) returns (GetClientResponse);
  rpc GetClientSecret(GetClientSecretRequest) returns (GetClientSecretResponse);
  rpc RotateClientSecret(RotateClientSecretRequest) returns (RotateClientSecretResponse);
  rpc GetClientConfig(GetClientConfigRequest) returns (GetClientConfigResponse);
  rpc CreateClient(CreateClientRequest) returns (CreateClientResponse);
  rpc UpdateClient(UpdateClientRequest) returns (UpdateClientResponse);
  rpc SetClientStatus(SetClientStatusRequest) returns (SetClientStatusResponse);
  rpc DeleteClient(DeleteClientRequest) returns (DeleteClientResponse);
  rpc ListClientURIs(ListClientURIsRequest) returns (ListClientURIsResponse);
  rpc CreateClientURI(CreateClientURIRequest) returns (CreateClientURIResponse);
  rpc UpdateClientURI(UpdateClientURIRequest) returns (UpdateClientURIResponse);
  rpc DeleteClientURI(DeleteClientURIRequest) returns (DeleteClientURIResponse);
  rpc ListClientAPIs(ListClientAPIsRequest) returns (ListClientAPIsResponse);
  rpc AddClientAPIs(AddClientAPIsRequest) returns (AddClientAPIsResponse);
  rpc RemoveClientAPI(RemoveClientAPIRequest) returns (RemoveClientAPIResponse);
  rpc ListClientAPIPermissions(ListClientAPIPermissionsRequest) returns (ListClientAPIPermissionsResponse);
  rpc AddClientAPIPermissions(AddClientAPIPermissionsRequest) returns (AddClientAPIPermissionsResponse);
  rpc RemoveClientAPIPermission(RemoveClientAPIPermissionRequest) returns (RemoveClientAPIPermissionResponse);
}

message Client {
  string client_uuid = 1;
  string name = 2;
  string display_name = 3;
  string client_type = 4;
  string domain = 5;
  string status = 6;
  bool is_default = 7;
  bool is_system = 8;
  ClientIdentityProvider identity_provider = 9;
  repeated ClientURI uris = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  string branding_id = 13;
  bool allow_registration = 14;
}

message ClientIdentityProvider {
  string identity_provider_uuid = 1;
  string name = 2;
  string display_name = 3;
  string provider = 4;
  string provider_type = 5;
  string identifier = 6;
  string status = 7;
  bool is_default = 8;
  bool is_system = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message ClientURI {
  string client_uri_uuid = 1;
  string uri = 2;
  string type = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message ClientAPI {
  string client_api_uuid = 1;
  ClientAPIDetail api = 2;
  repeated ClientAPIPermission permissions = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ClientAPIDetail {
  string api_uuid = 1;
  string name = 2;
  string display_name = 3;
  string description = 4;
  string status = 5;
  bool is_system = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ClientAPIPermission {
  string permission_uuid = 1;
  string name = 2;
  string description = 3;
  string status = 4;
  reserved 5;
  bool is_system = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ListClientsRequest {
  string tenant_uuid = 1;
  string name = 2;
  string display_name = 3;
  repeated string client_type = 4;
  string identity_provider_uuid = 5;
  repeated string status = 6;
  optional bool is_default = 7;
  optional bool is_system = 8;
  Pagination pagination = 9;
}

message ListClientsResponse {
  repeated Client clients = 1;
  PageMetadata page = 2;
}

message GetClientRequest {
  string tenant_uuid = 1;
  string client_uuid = 2;
}

message GetClientResponse {
  Client client = 1;
}

message GetClientSecretRequest {
  string tenant_uuid = 1;
  string client_uuid = 2;
}

message GetClientSecretResponse {
  string client_id = 1;
  string message = 2;
}

message RotateClientSecretRequest {
  string tenant_uuid = 1;
  string client_uuid = 2;
  string actor_user_uuid = 3;
  int32 grace_period_hours = 4;
}

message RotateClientSecretResponse {
  string client_secret = 1;
  string previous_secret_expires_at = 2;
}

message GetClientConfigRequest {
  string tenant_uuid = 1;
  string client_uuid = 2;
}

message GetClientConfigResponse {
  google.protobuf.Struct config = 1;
}

message CreateClientRequest {
  string tenant_uuid = 1;
  string name = 2;
  string display_name = 3;
  string client_type = 4;
  string domain = 5;
  google.protobuf.Struct config = 6;
  string status = 7;
  string identity_provider_uuid = 8;
  string actor_user_uuid = 9;
  string branding_id = 10;
  optional bool allow_registration = 11;
}

message CreateClientResponse {
  Client client = 1;
  ClientCredentials credentials = 2;
}

message ClientCredentials {
  string client_uuid = 1;
  string client_id = 2;
  string client_secret = 3;
}

message UpdateClientRequest {
  string tenant_uuid = 1;
  string client_uuid = 2;
  string name = 3;
  string display_name = 4;
  string client_type = 5;
  string domain = 6;
  google.protobuf.Struct config = 7;
  string status = 8;
  string actor_user_uuid = 9;
  string branding_id = 10;
  optional bool allow_registration = 11;
}

message UpdateClientResponse {
  Client client = 1;
}

message SetClientStatusRequest {
  string tenant_uuid = 1;
  string client_uuid = 2;
  string status = 3;
  string actor_user_uuid = 4;
}

message SetClientStatusResponse {
  Client client = 1;
}

message DeleteClientRequest {
  string tenant_uuid = 1;
  string client_uuid = 2;
  string actor_user_uuid = 3;
}

message DeleteClientResponse {
  Client client = 1;
}

message ListClientURIsRequest {
  string tenant_uuid = 1;
  string client_uuid = 2;
}

message ListClientURIsResponse {
  repeated ClientURI uris = 1;
}

message CreateClientURIRequest {
  string tenant_uuid = 1;
  string client_uuid = 2;
  string uri = 3;
  string type = 4;
  string actor_user_uuid = 5;
}

message CreateClientURIResponse {
  ClientURI uri = 1;
}

message UpdateClientURIRequest {
  string tenant_uuid = 1;
  string client_uuid = 2;
  string client_uri_uuid = 3;
  string uri = 4;
  string type = 5;
  string actor_user_uuid = 6;
}

message UpdateClientURIResponse {
  ClientURI uri = 1;
}

message DeleteClientURIRequest {
  string tenant_uuid = 1;
  string client_uuid = 2;
  string client_uri_uuid = 3;
  string actor_user_uuid = 4;
}

message DeleteClientURIResponse {
  Client client = 1;
}

message ListClientAPIsRequest {
  string tenant_uuid = 1;
  string client_uuid = 2;
}

message ListClientAPIsResponse {
  repeated ClientAPI apis = 1;
}

message AddClientAPIsRequest {
  string tenant_uuid = 1;
  string client_uuid = 2;
  repeated string api_uuids = 3;
  // Required. The mutation is refused without an actor holding an identity in the
  // tenant, so a grant change is never anonymous.
  string actor_user_uuid = 4;
}

message AddClientAPIsResponse {
  string message = 1;
}

message RemoveClientAPIRequest {
  string tenant_uuid = 1;
  string client_uuid = 2;
  string api_uuid = 3;
  string actor_user_uuid = 4;
}

message RemoveClientAPIResponse {
  string message = 1;
}

message ListClientAPIPermissionsRequest {
  string tenant_uuid = 1;
  string client_uuid = 2;
  string api_uuid = 3;
}

message ListClientAPIPermissionsResponse {
  repeated ClientAPIPermission permissions = 1;
}

message AddClientAPIPermissionsRequest {
  string tenant_uuid = 1;
  string client_uuid = 2;
  string api_uuid = 3;
  repeated string permission_uuids = 4;
  string actor_user_uuid = 5;
}

message AddClientAPIPermissionsResponse {
  string message = 1;
}

message RemoveClientAPIPermissionRequest {
  string tenant_uuid = 1;
  string client_uuid = 2;
  string api_uuid = 3;
  string permission_uuid = 4;
  string actor_user_uuid = 5;
}

message RemoveClientAPIPermissionResponse {
  string message = 1;
}

