syntax = "proto3";

package maintainerd.auth.v1;

import "google/protobuf/timestamp.proto";
import "maintainerd/auth/v1/tenant.proto";

option go_package = "github.com/maintainerd/maintainerd-auth/internal/platform/gen/go/maintainerd/auth;authv1";

// BrandingService, EmailTemplateService and SMSTemplateService used to be
// declared here with no handler registered anywhere in the tree, so every RPC
// they advertised answered UNIMPLEMENTED. A published contract that names RPCs
// the server never serves cannot be told apart from one that is simply down, so
// the service blocks were removed: branding and template administration is REST
// control-plane only (see internal/branding/routes.go). The messages below are
// kept as the agreed wire shape for the day a handler is written.

message Branding {
  string branding_uuid = 1;
  string company_name = 2;
  string logo_url = 3;
  string favicon_url = 4;
  string support_url = 10;
  string privacy_policy_url = 11;
  string terms_of_service_url = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  string name = 15;
  bool is_system = 16;
  bool is_active = 17;
  // Theme tokens (colors, fonts, panel backgrounds, …) as a JSON object string.
  string metadata = 18;
}

message GetBrandingRequest { string tenant_uuid = 1; }
message GetBrandingResponse { Branding branding = 1; }
message UpdateBrandingRequest {
  string tenant_uuid = 1;
  string company_name = 2;
  string logo_url = 3;
  string favicon_url = 4;
  string support_url = 10;
  string privacy_policy_url = 11;
  string terms_of_service_url = 12;
  string name = 13;
  string metadata = 14;
}
message UpdateBrandingResponse { Branding branding = 1; }

message EmailTemplate {
  string email_template_uuid = 1;
  string name = 2;
  string subject = 3;
  string body_html = 4;
  optional string body_plain = 5;
  string status = 6;
  bool is_default = 7;
  bool is_system = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message ListEmailTemplatesRequest {
  string tenant_uuid = 1;
  string name = 2;
  repeated string status = 3;
  optional bool is_default = 4;
  optional bool is_system = 5;
  Pagination pagination = 6;
}
message ListEmailTemplatesResponse { repeated EmailTemplate email_templates = 1; PageMetadata page = 2; }
message GetEmailTemplateRequest { string tenant_uuid = 1; string email_template_uuid = 2; }
message GetEmailTemplateResponse { EmailTemplate email_template = 1; }
message CreateEmailTemplateRequest {
  string tenant_uuid = 1;
  string name = 2;
  string subject = 3;
  string body_html = 4;
  optional string body_plain = 5;
  string status = 6;
  bool is_default = 7;
}
message CreateEmailTemplateResponse { EmailTemplate email_template = 1; }
message UpdateEmailTemplateRequest {
  string tenant_uuid = 1;
  string email_template_uuid = 2;
  string name = 3;
  string subject = 4;
  string body_html = 5;
  optional string body_plain = 6;
  string status = 7;
}
message UpdateEmailTemplateResponse { EmailTemplate email_template = 1; }
message SetEmailTemplateStatusRequest { string tenant_uuid = 1; string email_template_uuid = 2; string status = 3; }
message SetEmailTemplateStatusResponse { EmailTemplate email_template = 1; }
message DeleteEmailTemplateRequest { string tenant_uuid = 1; string email_template_uuid = 2; }
message DeleteEmailTemplateResponse { EmailTemplate email_template = 1; }

message SMSTemplate {
  string sms_template_uuid = 1;
  string name = 2;
  optional string description = 3;
  string message = 4;
  optional string sender_id = 5;
  string status = 6;
  bool is_default = 7;
  bool is_system = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message ListSMSTemplatesRequest {
  string tenant_uuid = 1;
  string name = 2;
  repeated string status = 3;
  optional bool is_default = 4;
  optional bool is_system = 5;
  Pagination pagination = 6;
}
message ListSMSTemplatesResponse { repeated SMSTemplate sms_templates = 1; PageMetadata page = 2; }
message GetSMSTemplateRequest { string tenant_uuid = 1; string sms_template_uuid = 2; }
message GetSMSTemplateResponse { SMSTemplate sms_template = 1; }
message CreateSMSTemplateRequest {
  string tenant_uuid = 1;
  string name = 2;
  optional string description = 3;
  string message = 4;
  optional string sender_id = 5;
  string status = 6;
}
message CreateSMSTemplateResponse { SMSTemplate sms_template = 1; }
message UpdateSMSTemplateRequest {
  string tenant_uuid = 1;
  string sms_template_uuid = 2;
  string name = 3;
  optional string description = 4;
  string message = 5;
  optional string sender_id = 6;
  string status = 7;
}
message UpdateSMSTemplateResponse { SMSTemplate sms_template = 1; }
message SetSMSTemplateStatusRequest { string tenant_uuid = 1; string sms_template_uuid = 2; string status = 3; }
message SetSMSTemplateStatusResponse { SMSTemplate sms_template = 1; }
message DeleteSMSTemplateRequest { string tenant_uuid = 1; string sms_template_uuid = 2; }
message DeleteSMSTemplateResponse { SMSTemplate sms_template = 1; }
