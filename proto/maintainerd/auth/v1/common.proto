syntax = "proto3";

package maintainerd.auth.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/maintainerd/auth/internal/platform/gen/go/maintainerd/auth;authv1";

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_INACTIVE = 2;
  STATUS_DISABLED = 3;
  STATUS_PENDING = 4;
}

message AuditFields {
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp updated_at = 2;
  string created_by = 3;
  string updated_by = 4;
}
