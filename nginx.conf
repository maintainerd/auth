# Production nginx config for the hosted identity SPA.
# Serves the Vite build with SPA fallback, long-lived immutable asset caching,
# gzip, and a hardened set of security headers.

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Security headers applied to every response.
    # The API is proxied under this origin (see /api/ below), so 'self' is the
    # only origin the app ever calls — nothing here can drift out of step with
    # the app's configuration.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------
    # Same-origin API.
    #
    # Auth cookies are __Host- prefixed — host-only, Domain forbidden by the
    # browser — so the API must be reachable on this origin for the session
    # cookie to come back with the app's own requests. Proxying here also
    # removes CORS entirely. Upstream is substituted at container start.
    # $host is forwarded so the backend can resolve the tenant from the
    # subdomain; rewriting it would break tenant scoping and the
    # maintenance/suspension gates.
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass __PUBLIC_API_ORIGIN__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 16k;
    }

    # Runtime config is regenerated on every container start; never cache it.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # Fingerprinted build assets are immutable and safe to cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths resolve to the app entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
