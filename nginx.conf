# Production nginx config for the admin console SPA.
# Serves the Vite build with SPA fallback, long-lived immutable asset caching,
# gzip, and a hardened set of security headers.

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Security headers applied to every response.
    # The API is proxied under this origin (see /api/ and /public-api/ below), so
    # 'self' is the only origin the console ever calls — no cross-origin XHR, and
    # nothing here to drift out of step with the app's configuration.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------
    # Same-origin API.
    #
    # The console authenticates by httpOnly cookie, and every auth cookie is
    # __Host- prefixed — host-only, Domain forbidden by the browser. Calling the
    # API on a sibling host therefore meant the session cookie was set on the API
    # host and never sent back with the console's own requests. Proxying both
    # planes under this origin keeps the cookie first-party, preserves the
    # __Host- protection, and removes CORS entirely. Mirrors the dev vite proxy.
    #
    # Upstreams are substituted at container start from the same env vars the app
    # reads (see docker-entrypoint.sh), so the proxy and the app cannot disagree.
    # ---------------------------------------------------------------------

    # Control plane (management API).
    # $host is forwarded, NOT the upstream's name: the backend resolves the
    # tenant and surface from the request host, so rewriting it would break
    # tenant scoping, IP restrictions and the maintenance/suspension gates.
    location /api/ {
        proxy_pass __INTERNAL_API_ORIGIN__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 16k;
    }

    # Data plane (OAuth2/OIDC + tenant bootstrap). The token exchange happens
    # here — it is a public authorization-server endpoint and must never be
    # served from the control plane. The prefix is stripped so the backend sees
    # its normal /api/v1/... path.
    location /public-api/ {
        rewrite ^/public-api/(.*)$ /$1 break;
        proxy_pass __PUBLIC_API_ORIGIN__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 16k;
    }

    # Runtime config is regenerated on every container start; never cache it.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # Fingerprinted build assets are immutable and safe to cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths resolve to the app entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
